# Platform: android or ios (override with -Dplatform=ios or the TestNG parameter)
platformName=android

# Android SDK. Override with -DandroidSdkPath=...
androidSdkPath=C:/Users/umair.Iqbal/AppData/Local/Android/Sdk

# Android capabilities. Set the APK, package, and launcher activity before any device run.
androidDeviceName=Android Device
androidAutomationName=UiAutomator2
androidAppPath=C:/MvolaAutomation/apps/mvolaapp.apk
androidAppPackage=mg.telma.mvolaapp
androidAppActivity=com.axian.flutter.project.axianfluttery.MainActivity
appWaitActivity=*
autoGrantPermissions=true
# Leave empty to auto-pick the only connected device. Set this when more than one phone is attached.
androidUdid=
adbExecTimeout=60000
# PIN that unlocks the phone itself. Used only when the lock screen is showing. Leave empty for a swipe-only lock.
deviceLockPin=

# iOS capabilities
iosDeviceName=iPhone Simulator
iosAutomationName=XCUITest
iosAppPath=
iosBundleId=

# Appium server
appiumServerIP=127.0.0.1
appiumServerPort=4723
# Waits (seconds)
implicitWait=10
explicitWait=20
fluentWaitPolling=500
fluentWaitTimeout=30
# Seconds to wait after login for each optional back-office popup before moving on.
popupWait=5

# App reset flags
noReset=true
fullReset=false

# Application test data. Keep secret values empty in this tracked file.
# ConfigReader uses a JVM system property of the same name when one is set.
# phone is the login number. recipientPhone is the destination for send money, gift, bundle, and airtime.
phone=
pin=
recipientPhone=
otp=
username=
password=
invalidPin=
invalidUsername=
invalidPassword=

# Account-sensitive login policy. A JVM system property with the same key overrides the file.
# validLogin=deny requires a one-time LOGIN_003 approval. repeat allows later suite runs
# without editing execution history. invalidPinLimit is the total recorded LOGIN_002 rows.
# A passing invalid-PIN result does not reduce that count.
mvola.accountSensitive.validLogin=deny
mvola.accountSensitive.invalidPinLimit=3

# Environment and reporting
environment=qa
tester=
projectName=MvolaAutomation
buildVersion=
# Screenshots land under reports/<run_id>/images (set at suite start). Fallback only:
stepScreenshotDir=reports/images
