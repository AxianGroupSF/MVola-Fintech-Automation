# Platform: android or ios (override with -Dplatform=ios or the TestNG parameter)
platformName=android

# Android SDK. Override with -DandroidSdkPath=...
androidSdkPath=C:/Users/umair.Iqbal/AppData/Local/Android/Sdk

# Android capabilities. Set the APK, package, and launcher activity before any device run.
androidDeviceName=Android Device
androidAutomationName=UiAutomator2
androidAppPath=
androidAppPackage=
androidAppActivity=
appWaitActivity=*
autoGrantPermissions=true
# Leave empty to auto-pick the only connected device. Set this when more than one phone is attached.
androidUdid=
adbExecTimeout=60000
# PIN that unlocks the phone itself. Used only when the lock screen is showing. Leave empty for a swipe-only lock.
deviceLockPin=

# iOS capabilities
iosDeviceName=iPhone Simulator
iosAutomationName=XCUITest
iosAppPath=
iosBundleId=

# Appium server
appiumServerIP=127.0.0.1
appiumServerPort=4723
# Waits (seconds)
implicitWait=10
explicitWait=20
fluentWaitPolling=500
fluentWaitTimeout=30

# App reset flags
noReset=true
fullReset=false

# Application test data. Keep these empty in git.
phone=
pin=
otp=
username=
password=
invalidPhone=
invalidPin=
invalidUsername=
invalidPassword=

# Environment and reporting
environment=qa
tester=
projectName=MvolaAutomation
buildVersion=
# Screenshots land under reports/<run_id>/images (set at suite start). Fallback only:
stepScreenshotDir=reports/images
